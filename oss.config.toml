# ─────────────────────────────────────────────────────────────────────────────
# Template configuration
# Every page, group, project, stat, link and theme on the site comes from here.
# Replace the placeholder below with your own projects. Docs: see README.md
# ─────────────────────────────────────────────────────────────────────────────

[site]
title = "FOSS"
tagline = "Open source by Jane Doe"
description = "Every open source project I build and maintain — live stats, releases and packages."
url = "https://foss.example.com"
github_user = "jane-doe"
cache_minutes = 15

[[site.links]]
label = "GitHub"
url = "https://github.com/jane-doe"

# ── Theme ────────────────────────────────────────────────────────────────────
# name:    portfolio | terminal | paper
# palette: teal | indigo | amber | rose | green
# mode:    dark | light | auto
[theme]
name = "portfolio"
palette = "teal"
mode = "auto"
switcher = true

# ── Profile ──────────────────────────────────────────────────────────────────
[profile]
enabled = true
name = "Jane Doe"
bio = "I build free software."

[profile.features]
last_commit = true
last_pr = true
last_issue = true
languages = true
followers = true
latest_release = true
streak = true

# ── Groups ───────────────────────────────────────────────────────────────────
[groups.tools]
label = "Tools"
order = 1

[groups.libraries]
label = "Libraries"
order = 2

# ── Projects ─────────────────────────────────────────────────────────────────
# status: production | beta | alpha | experimental | wip | archived
# stats:  stars | forks | issues | downloads | last_commit | license | release | languages
[projects.example]
name = "Example"
url = "https://github.com/jane-doe/example"
repo = "jane-doe/example"
description = "Replace this placeholder with your project: what it does, in one or two lines."
why = "One sentence on why the project exists."
status = "production"
group = "tools"
featured = true
stats = ["stars", "forks", "downloads", "last_commit", "license"]

[projects.example.stack]
languages = ["Python"]
frameworks = ["FastAPI"]
platforms = ["Docker", "Linux"]

[[projects.example.packages]]
url = "https://pypi.org/project/example/"

[projects.example.fallback]
stars = 120
downloads = "10k"

[projects.example.page]
why = true
releases = true
contributors = true
