# ─────────────────────────────────────────────────────────────────────────────
# foss.emiliano-go.com — dashboard configuration
# Every page, group, project, stat, link and theme on the site comes from here.
# Repos, licenses and packages verified with `gh` against the portfolio lists.
# Docs and schema: see src/lib/config.ts
# ─────────────────────────────────────────────────────────────────────────────

[site]
title = "FOSS"
tagline = "Open source by Emiliano G.O."
description = "Every open source project I build and maintain — live stats, releases and packages."
url = "https://foss.emiliano-go.com"
github_user = "emiliano-go"
cache_minutes = 15

[[site.links]]
label = "Portfolio"
url = "https://emiliano-go.com"

[[site.links]]
label = "GitHub"
url = "https://github.com/emiliano-go"

# ── Theme ────────────────────────────────────────────────────────────────────
# name:    portfolio | terminal | paper
# palette: teal | indigo | amber | rose | green
# mode:    dark | light | auto
[theme]
name = "portfolio"
palette = "teal"
mode = "auto"
switcher = true

[theme.colors]
# accent = "#5ba3a8"

# ── Profile ──────────────────────────────────────────────────────────────────
[profile]
enabled = true
name = "Emiliano G.O."
bio = "I build free software, mostly for Uruguay."

[profile.features]
last_commit = true
last_pr = true
last_issue = true
languages = true
followers = true
latest_release = true
streak = true

# ── Groups ───────────────────────────────────────────────────────────────────
[groups.core]
label = "Core"
order = 1

[groups.libraries]
label = "Libraries"
order = 2

[groups.tooling]
label = "Tooling & Apps"
order = 3

[groups.legacy]
label = "Legacy"
order = 5

[groups.community]
label = "Community"
order = 6

# ── Organizations ────────────────────────────────────────────────────────────
# Each org gets its own section on the homepage. Projects land in an org
# section when their repo owner matches the login, or via `org = "login"` for
# repo-less org entries. Org repos are excluded from group sections.

[orgs.dbwarden-org]
name = "DBWarden"
description = "Declarative database migrations for Python and the plugin ecosystem around them."
url = "https://github.com/dbwarden-org"
order = 1

[orgs.LibreCourseUY]
name = "LibreCourseUY"
description = "Open source organization promoting the FOSS ecosystem in Uruguay. 400+ members."
url = "https://github.com/LibreCourseUY"
order = 2

# ── Featured / Core ──────────────────────────────────────────────────────────
# Mirrors portfolio's featured list:
# DBWarden, TrustSight, rypipe, postal, neurafly, easeo, ClickVault, dsig.
# status: production | beta | alpha | experimental | wip | archived
# stats:  stars | forks | issues | downloads | last_commit | license | release | languages

[projects.dbwarden]
name = "DBWarden"
url = "https://github.com/dbwarden-org/dbwarden"
repo = "dbwarden-org/dbwarden"
description = "Declarative schema compiler for SQLAlchemy. 48K LOC, 127 test files, 5 DB backends, 7 plugins, release-certification harness."
why = "Schema changes shouldn't depend on hand-written migration files."
status = "production"
group = "core"
featured = true
stats = ["stars", "forks", "downloads", "last_commit", "license"]
related = ["trustsight", "rypipe", "dbwarden-harness"]

[projects.dbwarden.stack]
languages = ["Python", "SQL"]
frameworks = ["SQLAlchemy", "PostgreSQL", "MySQL", "ClickHouse"]
platforms = ["Docker", "Linux"]

[projects.dbwarden.links]
docs = "https://docs.dbwarden.org"
changelog = "https://github.com/dbwarden-org/dbwarden/releases"

[[projects.dbwarden.packages]]
url = "https://pypi.org/project/dbwarden/"
description = "PyPI package"

[projects.trustsight]
name = "TrustSight"
url = "https://github.com/emiliano-go/trustsight"
repo = "emiliano-go/trustsight"
description = "Evidence-driven security analysis for AUR packages. 3,967+ tests, 185 scoring rules, corpus-wide cluster detection, signed IOC baselines. Never executes code."
why = "AUR updates deserve scrutiny before they run, and analysis should never execute the code it judges."
status = "production"
group = "core"
